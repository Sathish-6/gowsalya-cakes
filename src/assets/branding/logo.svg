<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Gowsalya Cake Shop logo">
  <title>Gowsalya Cake Shop</title>
  <defs>
    <linearGradient id="berryBg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#E8639A"/>
      <stop offset="45%" stop-color="#C21E5C"/>
      <stop offset="100%" stop-color="#6B0F35"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E2AC"/>
      <stop offset="45%" stop-color="#E3B84F"/>
      <stop offset="100%" stop-color="#B9871F"/>
    </linearGradient>
    <linearGradient id="creamFrost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="100%" stop-color="#F6E3C8"/>
    </linearGradient>
    <path id="arcTop" d="M 33,100 A 67,67 0 0 1 167,100" fill="none"/>
    <!-- Sits below the plate (y=144) and clear of the dashed inner ring (y=178). -->
    <path id="arcBottom" d="M 45,136 A 68,68 0 0 0 155,136" fill="none"/>
  </defs>

  <!-- outer disc -->
  <circle cx="100" cy="100" r="97" fill="url(#berryBg)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#goldRing)" stroke-width="5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#F6E2AC" stroke-width="1.2" opacity=".75" stroke-dasharray="2 5"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#F6E2AC" stroke-width="0.8" opacity=".45"/>

  <!-- curved lettering -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="2.4" fill="url(#goldRing)">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">GOWSALYA</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="700" letter-spacing="3.4" fill="#FFFBF2">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">CAKE SHOP</textPath>
  </text>

  <!-- soft glow behind cake -->
  <ellipse cx="100" cy="104" rx="40" ry="30" fill="#FFFFFF" opacity=".12"/>

  <!-- plate -->
  <ellipse cx="100" cy="137" rx="42" ry="7" fill="#F6E2AC" opacity=".95"/>

  <!-- bottom tier (chocolate) -->
  <path d="M62,112 q10,9 19,0 q9,9 19,0 q9,9 19,0 l0,20 q0,6 -6,6 l-45,0 q-6,0 -6,-6 z" fill="#5A2E1B"/>
  <rect x="62" y="108" width="76" height="8" rx="4" fill="#7A4426"/>

  <!-- top tier (strawberry pink) -->
  <path d="M72,88 q8,8 14,0 q7,8 14,0 q7,8 14,0 l0,20 q0,5 -5,5 l-32,0 q-5,0 -5,-5 z" fill="#D63A74"/>
  <path d="M72,88 q8,8 14,0 q7,8 14,0 q7,8 14,0 l0,5 q-5,0 -5,-1 l-32,0 q-5,0 -5,1 z" fill="url(#creamFrost)"/>

  <!-- candle -->
  <rect x="97" y="66" width="6" height="20" rx="3" fill="url(#goldRing)"/>
  <path d="M100,54 c5,6 7,9 7,12 a7,7 0 0 1 -14,0 c0,-3 2,-6 7,-12 z" fill="#FFD97A"/>

  <!-- heart accents -->
  <g transform="translate(52,80) scale(0.9)" fill="#FF9EC4">
    <path d="M0,4 C0,0 3,-2 5,-2 C7,-2 10,0 10,4 C10,8 5,12 5,12 C5,12 0,8 0,4 Z"/>
  </g>
  <g transform="translate(140,84) scale(0.75)" fill="#FF9EC4">
    <path d="M0,4 C0,0 3,-2 5,-2 C7,-2 10,0 10,4 C10,8 5,12 5,12 C5,12 0,8 0,4 Z"/>
  </g>

  <!-- gold sprinkles -->
  <g fill="#F6E2AC" opacity=".9">
    <circle cx="80" cy="120" r="1.6"/><circle cx="96" cy="126" r="1.6"/>
    <circle cx="112" cy="120" r="1.6"/><circle cx="124" cy="127" r="1.4"/>
    <circle cx="86" cy="99" r="1.4"/><circle cx="114" cy="98" r="1.4"/>
  </g>
</svg>
